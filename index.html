<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Go Fish — the card game, playable against computer players in your browser.">
<title>Go Fish</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%90%9F</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ------------------------------------------------------------ title -->
<section class="screen" id="title-screen">
  <div class="title-inner">
    <header class="brand">
      <div class="brand-cards" aria-hidden="true">
        <span class="mini-card red">A<i>&hearts;</i></span>
        <span class="mini-card">K<i>&spades;</i></span>
        <span class="mini-card red">Q<i>&diams;</i></span>
      </div>
      <h1>Go Fish</h1>
      <p class="brand-sub">Ask, fish, collect books of four.</p>
    </header>

    <div class="setup">
      <div class="field">
        <label class="field-label" for="variant-list">Game</label>
        <div class="chips" id="variant-list" role="radiogroup" aria-label="Game version"></div>
        <p class="field-hint" id="variant-hint"></p>
      </div>

      <div class="field">
        <span class="field-label" id="count-label">Computer players</span>
        <div class="stepper" role="group" aria-labelledby="count-label">
          <button type="button" class="step" id="count-down" aria-label="Fewer computer players">&minus;</button>
          <output class="step-value" id="count-value">3</output>
          <button type="button" class="step" id="count-up" aria-label="More computer players">+</button>
        </div>
        <p class="field-hint" id="count-hint"></p>
      </div>

      <button type="button" class="primary" id="start-btn">Start game</button>
      <button type="button" class="link" id="title-rules-btn">How to play</button>
    </div>
  </div>
</section>

<!-- ------------------------------------------------------------- game -->
<section class="screen hidden" id="game-screen">
  <header class="topbar">
    <button type="button" class="icon-btn" id="quit-btn" aria-label="Back to menu">&#8592;</button>
    <div class="turn-pill" id="turn-pill">Your turn</div>
    <button type="button" class="icon-btn" id="rules-btn" aria-label="How to play">?</button>
  </header>

  <div class="opponents" id="opponents"></div>

  <div class="table">
    <button type="button" class="pond" id="pond" aria-label="The pond">
      <span class="pond-cards" id="pond-cards" aria-hidden="true"></span>
      <span class="pond-count" id="pond-count">52</span>
      <span class="pond-tap" id="pond-tap">Tap to fish</span>
    </button>
  </div>

  <p class="status" id="status" role="status" aria-live="polite">&nbsp;</p>

  <div class="hand-area">
    <div class="hand-head">
      <span class="you-name" id="you-name">You</span>
      <span class="you-books" id="you-books"></span>
    </div>
    <div class="hand" id="hand"></div>
  </div>
</section>

<!-- ---------------------------------------------------------- overlays -->
<div class="reveal-layer" id="reveal-layer" aria-hidden="true"></div>

<div class="sheet-backdrop hidden" id="sheet-backdrop">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grab" aria-hidden="true"></div>
    <h2 id="sheet-title">How to play</h2>
    <div class="sheet-body" id="sheet-body"></div>
    <button type="button" class="primary" id="sheet-close">Got it</button>
  </div>
</div>

<div class="results hidden" id="results">
  <div class="results-card">
    <h2 id="results-title">Game over</h2>
    <ol class="scoreboard" id="scoreboard"></ol>
    <button type="button" class="primary" id="again-btn">Play again</button>
    <button type="button" class="link" id="menu-btn">Back to menu</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
